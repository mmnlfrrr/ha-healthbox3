name: Validate with hassfest

# Also runnable by hand, from the Actions tab. Worth having: a push made
# by an app installation token - which is how automation pushes here -
# deliberately does not trigger workflows, so without this the only way to
# get a run on such a commit is to push it again from a personal account.
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - ".gitignore"
      - "LICENSE"
      - "CLAUDE.md"
      - "README.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
  pull_request:
    paths-ignore:
      - ".gitignore"
      - "LICENSE"
      - "CLAUDE.md"
      - "README.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
  schedule:
    - cron: "0 0 * * *"

jobs:
  validate:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - uses: "home-assistant/actions/hassfest@master"
